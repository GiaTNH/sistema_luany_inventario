spring.application.name=inventory

# Conexión flexible a la base de datos (Separamos el valor por defecto para evitar errores de lectura)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

resend.api-key=${MAIL_API_KEY:}
mail.from.email=${MAIL_FROM_EMAIL:onboarding@resend.dev}
mail.from.name=${MAIL_FROM_NAME:LUANY}

gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite

# Puerto dinámico indispensable para la nube
server.port=${PORT:8080}
