<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUANY — Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/animaciones.css" />
</head>
<body class="clientes-page">
  <button class="btn-menu-movil" id="btn-menu-movil" aria-label="Menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="layout">
    <aside class="sidebar">
      <svg class="sidebar-background-shapes" viewBox="0 0 320 900" preserveAspectRatio="none" aria-hidden="true">
        <path d="M218 0h102v218c-31-13-43-48-69-57-31-11-55 14-83 2-23-10-25-37-15-62 13-34-1-72 23-101 13-15 25-18 42-19Z" fill="#352A85" opacity=".6"/>
        <path d="M0 520c46 7 62 28 75 58 13 32 40 37 69 44 29 7 44 27 33 60-10 30 5 54 46 64 36 9 44 39 15 62-27 21-62 8-88 30-20 17-28 43-59 62H0Z" fill="#150F40" opacity=".48"/>
      </svg>
      <div class="sidebar-logo">
        <div class="sidebar-brand">
          <span class="sidebar-brand-bag" aria-hidden="true">
            <img src="/img/logo-bolsa.png" alt="" onerror="this.hidden=true" />
            <svg class="sidebar-bag-fallback" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M19 23h26l5 32H14l5-32Z" fill="#8B5CF6" stroke="#fff" stroke-width="2"/>
              <path d="M23 24v-7a9 9 0 0 1 18 0v7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
              <path d="M32 44s-8-5.3-8-10.2a4.8 4.8 0 0 1 8-3.5 4.8 4.8 0 0 1 8 3.5C40 38.7 32 44 32 44Z" fill="#fff"/>
            </svg>
          </span>
          <span class="sidebar-brand-copy">
            <span class="sidebar-brand-name">Luany</span>
            <svg class="sidebar-brand-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21S2 15 2 8.5A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 10 3.5C22 15 12 21 12 21Z"/></svg>
            <span class="sidebar-brand-tagline">Panel de Inventario</span>
          </span>
        </div>
      </div>
      <div class="sidebar-location" aria-hidden="true">
        <span class="sidebar-location-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span>Juega · Viste · Crece</span>
        <svg class="sidebar-location-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <nav class="sidebar-nav sidebar-nav-pending" aria-label="Navegación principal"></nav>
      <div class="sidebar-mascot" aria-hidden="true">
        <svg class="sidebar-decoration-art" viewBox="0 0 180 140" fill="none"><path d="M100 92S76 76 76 61a13 13 0 0 1 24-7 13 13 0 0 1 24 7c0 15-24 31-24 31Z" fill="#4C2FA8"/><path d="M48 113s-12-8-12-16a7 7 0 0 1 13-4 7 7 0 0 1 13 4c0 8-14 16-14 16Z" fill="#4C2FA8" opacity=".8"/></svg>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-usuario" aria-label="Perfil" title="Perfil">
          <div class="sidebar-avatar" id="avatar-inicial">U</div>
          <div class="sidebar-usuario-info"><span class="sidebar-profile-label">Perfil</span><span class="sidebar-usuario-nombre" id="nombre-usuario"></span><span class="sidebar-usuario-rol" id="rol-usuario"></span></div>
          <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <a class="sidebar-password-link" href="/cambiar-password.html" aria-label="Cambiar contraseña" title="Cambiar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><span>Cambiar contraseña</span></a>
        <button class="btn-cerrar-sesion" aria-label="Cerrar sesión" title="Cerrar sesión"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17 15 12 10 7M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg><span>Cerrar sesión</span><svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </aside>

    <main class="contenido-principal">
      <header class="topbar">
        <div class="topbar-titulo">
          <h2 id="titulo-pagina">Clientes</h2>
          <p>Directorio y datos de contacto</p>
        </div>
      </header>
      <section class="pagina clientes-contenido">
        <div class="panel">
          <div class="panel-header clientes-panel-header">
            <h3>Clientes</h3>
            <button type="button" class="btn btn-primario" id="btn-nuevo-cliente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              Nuevo cliente
            </button>
          </div>
          <div class="panel-body">
            <div class="clientes-busqueda">
              <label for="buscar-cliente">Buscar por nombre o documento</label>
              <input id="buscar-cliente" class="form-control" type="search" maxlength="120" placeholder="Escribe un nombre o número de documento" autocomplete="off" />
            </div>
            <p class="text-suave clientes-mensaje" id="clientes-mensaje" role="status" aria-live="polite">Cargando clientes...</p>
            <div class="tabla-wrapper">
              <table class="clientes-tabla">
                <thead>
                  <tr><th>Nombre completo</th><th>Documento</th><th>Número</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla-clientes-body">
                  <tr><td colspan="6">Cargando clientes...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay clientes-modal" id="modal-cliente" role="dialog" aria-modal="true" aria-labelledby="modal-cliente-titulo" aria-hidden="true" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-cliente-titulo">Nuevo cliente</h3>
        <button type="button" class="btn-cerrar-modal" id="btn-cerrar-modal-cliente" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-cliente" novalidate>
          <input type="hidden" id="cliente-id" />
          <div class="form-grupo">
            <label for="cliente-nombre">Nombre completo *</label>
            <input id="cliente-nombre" class="form-control" type="text" maxlength="120" autocomplete="name" required />
          </div>
          <div class="form-fila">
            <div class="form-grupo">
              <label for="cliente-tipo-documento">Tipo de documento *</label>
              <select id="cliente-tipo-documento" class="form-control" required>
                <option value="">Seleccionar...</option>
                <option value="DNI">DNI</option>
                <option value="RUC">RUC</option>
                <option value="OTRO">Otro</option>
              </select>
            </div>
            <div class="form-grupo">
              <label for="cliente-numero-documento">Número de documento *</label>
              <input id="cliente-numero-documento" class="form-control" type="text" maxlength="20" required />
            </div>
          </div>
          <div class="form-fila">
            <div class="form-grupo">
              <label for="cliente-telefono">Teléfono</label>
              <input id="cliente-telefono" class="form-control" type="tel" maxlength="20" autocomplete="tel" />
            </div>
            <div class="form-grupo">
              <label for="cliente-direccion">Dirección</label>
              <input id="cliente-direccion" class="form-control" type="text" maxlength="200" autocomplete="street-address" />
            </div>
          </div>
          <p class="clientes-error" id="error-cliente" role="alert" hidden></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="form-cliente" class="btn btn-primario" id="btn-guardar-cliente">Guardar cliente</button>
        <button type="button" class="btn btn-secundario" id="btn-cancelar-cliente">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay clientes-modal" id="modal-eliminar-cliente" role="dialog" aria-modal="true" aria-labelledby="titulo-eliminar-cliente" aria-hidden="true" hidden>
    <div class="modal clientes-modal-confirmar">
      <div class="modal-header">
        <h3 id="titulo-eliminar-cliente">¿Eliminar cliente?</h3>
        <button type="button" class="btn-cerrar-modal" id="btn-cerrar-eliminar-cliente" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body"><p id="mensaje-eliminar-cliente">¿Deseas eliminar este cliente?</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-peligro" id="btn-confirmar-eliminar-cliente">Sí, eliminar</button>
        <button type="button" class="btn btn-secundario" id="btn-cancelar-eliminar-cliente">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>cargarPaginaProtegida('/js/clientes.js');</script>
  <script src="/js/animaciones.js"></script>
</body>
</html>
