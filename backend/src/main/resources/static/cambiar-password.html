
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | LUANY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-screen">

    <main class="login-page">
        <section class="login-card">

            <aside class="login-art-panel">
                <div class="login-art-top">
                    <img class="login-art-logo-oficial" src="/img/logo_luany.png" alt="LUANY - Juega, Viste, Crece">
                </div>
                <div class="login-art-sparkles" aria-hidden="true"><i>✦</i><i>✧</i><i>✦</i><i>♥</i></div>
                <img class="login-art-bear" src="/img/osito-nube.png" alt="Osito morado con un corazón" onerror="this.hidden=true">
                <div class="login-art-phrase">Pequeños momentos,<br>grandes etapas<span class="login-phrase-underline"></span><span class="login-phrase-heart">♥</span></div>
                <div class="login-art-clouds" aria-hidden="true"><i></i><i></i><i></i></div>
            </aside>

            <div class="login-content">
                <div class="login-mobile-brand">
                    <img src="/img/logo_luany.png" alt="LUANY - Juega, Viste, Crece">
                </div>
                <div class="login-heading-heart">♡</div>

                <h1 class="login-bienvenida" id="password-heading">¡Bienvenido a LUANY!</h1>

                <p class="login-subtitulo" id="password-subtitle">
                    Antes de continuar, debes crear tu contraseña personal.
                </p>

                <form id="form-cambiar-password" class="login-form activo">

                <div class="login-field" id="password-actual-field" hidden>
                    <div class="login-field-copy">
                        <label for="password-actual">Contraseña actual</label>
                        <input
                            type="password"
                            id="password-actual"
                            class="form-control"
                            placeholder="Ingresa tu contraseña actual"
                            maxlength="72"
                            autocomplete="current-password">
                    </div>
                    <button
                        type="button"
                        class="login-password-toggle"
                        id="password-actual-toggle"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                        title="Mostrar contraseña">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>
                </div>

                <div class="login-field">
                    <div class="login-field-copy">
                        <label for="nueva-password">Nueva contraseña</label>
                        <input
                            type="password"
                            id="nueva-password"
                            name="nuevaPassword"
                            class="form-control"
                            placeholder="Mínimo 12 caracteres"
                            minlength="12"
                            maxlength="72"
                            required
                            autocomplete="new-password">
                    </div>

                    <button
                        type="button"
                        class="login-password-toggle"
                        id="nueva-password-toggle"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                        title="Mostrar contraseña">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>
                </div>

                <div class="login-field">
                    <div class="login-field-copy">
                        <label for="confirmar-password">Confirmar contraseña</label>
                        <input
                            type="password"
                            id="confirmar-password"
                            name="confirmarPassword"
                            class="form-control"
                            placeholder="Repite tu nueva contraseña"
                            maxlength="72"
                            required
                            autocomplete="new-password">
                    </div>

                    <button
                        type="button"
                        class="login-password-toggle"
                        id="confirmar-password-toggle"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                        title="Mostrar contraseña">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>
                </div>

                    <p id="password-error" class="login-api-error" hidden></p>

                    <button type="submit" id="btn-cambiar-password" class="btn-login-full">
                        Guardar nueva contraseña
                    </button>
                </form>

                <p class="login-pie">LUANY · Sistema de inventario</p>
            </div>

        </section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        cargarPaginaProtegida('/js/cambiar-password.js', {
            gestionarPassword: true
        });
    </script>

</body>
</html>
